<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirme seu e-mail — Cheipi</title>
  </head>
  <body style="margin: 0; padding: 24px 16px; background: #f5f5f5; color: #171717; font-family: Arial, sans-serif;">
    <main style="max-width: 480px; margin: 0 auto; padding: 24px; background: #ffffff; border-radius: 16px;">
      <p style="margin: 0 0 24px; font-size: 20px; font-weight: 700;">Cheipi</p>
      <h1 style="margin: 0 0 16px; font-size: 24px;">Confirme seu e-mail</h1>
      <p style="font-size: 16px; line-height: 1.5;">Para continuar seu cadastro, volte à Cheipi e digite o código de 8 dígitos abaixo:</p>
      <p style="margin: 24px 0; font-family: monospace; font-size: 28px; font-weight: 700; letter-spacing: 2px;">{{ .Token }}</p>
      <p style="font-size: 14px; line-height: 1.5;">Se o código expirar, use “Reenviar código” na tela de cadastro e digite o código do e-mail mais recente.</p>
      <p style="margin-bottom: 0; color: #525252; font-size: 14px; line-height: 1.5;">Se você não iniciou este cadastro, ignore esta mensagem.</p>
    </main>
  </body>
</html>
